[workspace]
resolver = "3"
members = [
    "crates/*"
]

[workspace.package]
version = "0.0.1"
rust-version = "1.88"
edition = "2024"
authors = [
    "Mohammed R.W Neundorf <ninevillage@gmail.com>"
]
description = "database viewer"
documentation = "https://dbv.nax.me"
homepage = "https://dbv.nax.me"
repository = "https://github.com/naxmefy/dbv"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
dbv-core = { path = "crates/dbv-core", version = "0.0.1" }
dbv-sqlite = { path = "crates/dbv-sqlite", version = "0.0.1" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = "0.29"
directories = "6"
insta = "1"
open = "5"
ratatui = "0.30"
ratatui-textarea = "0.9"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
ulid = "3"
unicode-width = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
