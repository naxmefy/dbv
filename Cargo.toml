[workspace]
resolver = "3"
members = [
    "crates/*"
]

[workspace.package]
version = "0.1.0"
rust-version = "1.88"
edition = "2024"
authors = [
    "Mohammed R.W Neundorf <ninevillage@gmail.com>"
]
description = "database viewer"
documentation = "https://dbv.nax.me"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
